resources:
  jobs:
    salescsv_medallion:
      name: SalesCSV Medallion
      description: Classic single-node Bronze-to-Gold processing for the SalesCSV workload.
      job_clusters:
        - job_cluster_key: salescsv_job_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_D4ds_v4
            runtime_engine: PHOTON
            data_security_mode: USER_ISOLATION
            num_workers: 0
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: bronze_ingestion
          max_retries: 1
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          job_cluster_key: salescsv_job_cluster
          notebook_task:
            notebook_path: ../process/salescsv/01_bronze_ingestion.ipynb
            base_parameters:
              environment: ${var.environment}
              ingestion_timestamp: "{{job.start_time.iso_datetime}}"

        - task_key: silver_transformation
          max_retries: 1
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: salescsv_job_cluster
          notebook_task:
            notebook_path: ../process/salescsv/02_silver_transformation.ipynb
            base_parameters:
              environment: ${var.environment}
              ingestion_timestamp: "{{job.start_time.iso_datetime}}"

        - task_key: gold_analytics
          max_retries: 1
          min_retry_interval_millis: 30000
          retry_on_timeout: true
          depends_on:
            - task_key: silver_transformation
          job_cluster_key: salescsv_job_cluster
          notebook_task:
            notebook_path: ../process/salescsv/03_gold_analytics.ipynb
            base_parameters:
              environment: ${var.environment}
              ingestion_timestamp: "{{job.start_time.iso_datetime}}"
