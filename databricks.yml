# Declarative Automation Bundle for the medallion workloads.
bundle:
  name: dbx-medallion-automation

include:
  - resources/*.job.yml

variables:
  environment:
    description: Environment passed to the workload notebooks.
    default: dev

run_as:
  service_principal_name: acc15410-5c5f-473e-bc6f-61b7946176a2

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405608715976720.0.azuredatabricks.net
    variables:
      environment: dev
    resources:
      jobs:
        salesjson_medallion:
          trigger:
            pause_status: PAUSED
            file_arrival:
              url: abfss://landing@stcentralusjrdev.dfs.core.windows.net/salesjson/incoming/
              min_time_between_triggers_seconds: 900
              wait_after_last_change_seconds: 60
        salescsv_medallion:
          schedule:
            quartz_cron_expression: "0 0/15 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED
        saleslt_medallion:
          schedule:
            quartz_cron_expression: "0 5/15 * * * ?"
            timezone_id: UTC
            pause_status: PAUSED

  # Prepared for promotion only; do not deploy from dev_qa.
  prod:
    mode: production
    workspace:
      host: https://adb-7405604697927684.4.azuredatabricks.net
    variables:
      environment: prod
